name: Release

# How a release happens:
#
#   1. Pull requests are squash-merged into main. Their titles (`type(scope): summary`) are the
#      commit messages.
#   2. On every push to main, release-please reads those messages and keeps ONE pull request open,
#      "chore: release x.y.z", that holds the new version number and the changelog.
#      That pull request is opened with the default GITHUB_TOKEN, and GitHub starts no other
#      workflow for events caused by that token: CI does not run on it by itself. Close and reopen
#      the pull request once (a person doing it does start CI) before merging, if the branch rules
#      require the checks.
#   3. A person merges that pull request when a release is wanted. The next run of this workflow
#      then creates the git tag and the GitHub release (release_created is true) ...
#   4. ... and, in the same run, the `installer` job builds the Windows installer and attaches
#      Marubako-Setup-<version>.exe, its .blockmap and latest.yml (the file the in-app updater
#      reads) to that release, and then the portable copy, Marubako-<version>-portable.zip.
#
# Why the installer is built by a job of THIS workflow and not by a separate workflow that starts on
# the tag or on the release: the tag and the release in step 3 are created with the default
# GITHUB_TOKEN, and GitHub deliberately does not start other workflows for anything that token does
# (to prevent endless loops). A workflow with `on: push: tags` or `on: release` would never run.
# Chaining the jobs inside one workflow needs no extra secret; a personal access token or a GitHub
# App would.
#
# The version of the very first release is decided by the last commit that is on main before this
# workflow runs for the first time: put a line `Release-As: 3.0.0` in the body of that commit
# message. From then on the version follows the commit types (fix: patch, feat: minor, feat!: major).
#
# Repository settings this needs (Settings > Actions > General): workflow permissions "Read and
# write", and "Allow GitHub Actions to create and approve pull requests" ticked.

on:
  push:
    branches: [main]

# `contents: write` creates the tag and the release and lets the installer job upload files;
# `pull-requests: write` and `issues: write` let release-please open its pull request and label it.
permissions:
  contents: write
  pull-requests: write
  issues: write

# Two runs must not publish at the same time, and a run that is already publishing is never cancelled.
concurrency:
  group: release
  cancel-in-progress: false

env:
  HUSKY: '0'

jobs:
  release-please:
    name: Release pull request
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - id: release
        uses: googleapis/release-please-action@v4
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  installer:
    name: Windows installer
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      TAG: ${{ needs.release-please.outputs.tag_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      # electron-builder names the release it uploads to after package.json, so the two must agree.
      - name: The tag matches package.json
        shell: bash
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "$TAG" != "v$version" ]; then
            echo "::error::The tag $TAG does not match the version $version in package.json."
            exit 1
          fi

      # scripts/set-github-owner.cjs fills the owner in; a release with the token left in it would
      # point the updater and every link at a repository that does not exist. (The pattern is written
      # with brackets so that this file does not match itself.)
      - name: The GitHub owner is filled in
        shell: bash
        run: |
          if git grep -nE 'GITHUB_USER[_]PLACEHOLDER' -- . ':(exclude)docs' ':(exclude)scripts' ':(exclude)tools' ':(exclude,glob)**/__tests__/**'; then
            echo "::error::The files above still contain the GitHub owner placeholder. Run scripts/set-github-owner.cjs."
            exit 1
          fi

      # The same gate a pull request passed, again, because ci.yml does not block a release.
      - name: ESLint
        run: npx eslint src e2e scripts tools
      - name: Unit tests
        run: npx vitest run
      - name: Build
        run: npm run build

      # `--publish always` uploads to the release that release-please just created (found by its tag
      # v<version>). GH_TOKEN is the default token of this run; it needs `contents: write`.
      # EP_GH_IGNORE_TIME lets a re-run of this job, hours later, still upload: by default
      # electron-builder silently skips a release that is more than two hours old.
      - name: Build the installer and upload it
        run: npx electron-builder --config electron-builder.config.cjs --win nsis --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EP_GH_IGNORE_TIME: 'true'

      - name: The release has the installer and the update manifest
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          assets="$(gh release view "$TAG" --json assets --jq '.assets[].name')"
          echo "$assets"
          grep -q '^Marubako-Setup-.*\.exe$' <<< "$assets"
          grep -qx 'latest.yml' <<< "$assets"

      # The installer is not code-signed. Say so, and how to continue, on the release page itself,
      # together with the checksum of the file.
      - name: Add the install notes to the release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          installer="$(ls release/*/Marubako-Setup-*.exe | head -n 1)"
          sha256="$(sha256sum "$installer" | cut -d ' ' -f 1)"
          gh release view "$TAG" --json body --jq .body > notes.md
          {
            echo
            echo '## Install'
            echo
            echo "Download \`$(basename "$installer")\` from the assets below and run it."
            echo
            echo 'The installer is not code-signed, so Windows may show **Windows protected your PC**. Click **More info**, then **Run anyway**.'
            echo
            echo "SHA-256: \`$sha256\`"
          } >> notes.md
          gh release edit "$TAG" --notes-file notes.md

      # The portable copy comes last: by now the release is complete for whoever installs, and stays
      # so if one of these steps fails. It is the program the installer was built from
      # (win-unpacked), zipped with the file that marks it as portable. It is started from where it
      # was unpacked before it is uploaded: a zip that does not find itself portable would run on
      # the data of an installed copy, and must not be published under that name.
      - name: Make the portable copy
        run: node scripts/make-portable.cjs
      - name: Start the portable copy
        run: node scripts/smoke-portable.cjs
      - name: Upload the portable copy
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "$TAG" release/*/Marubako-*-portable.zip --clobber
          assets="$(gh release view "$TAG" --json assets --jq '.assets[].name')"
          grep -q '^Marubako-.*-portable\.zip$' <<< "$assets"
      - name: Add the portable notes to the release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          portable="$(ls release/*/Marubako-*-portable.zip | head -n 1)"
          sha256="$(sha256sum "$portable" | cut -d ' ' -f 1)"
          gh release view "$TAG" --json body --jq .body > notes.md
          {
            echo
            echo '## Portable'
            echo
            echo "Without installing: download \`$(basename "$portable")\`, unpack it anywhere and run \`Marubako.exe\` in the folder. It keeps everything in a \`data\` folder beside it, and it does not update itself: for a new version, unpack the new zip over the old folder."
            echo
            echo "SHA-256: \`$sha256\`"
          } >> notes.md
          gh release edit "$TAG" --notes-file notes.md
